# Every repository this platform serves preview environments for.
#
# Onboarding is an edit to this file: reviewable, revertible, and visible in
# `git log` like everything else here. Nothing is configured by clicking.
#
# The slug is what keeps two repositories apart. Environments are named from
# the pull request number, and pull request #1 exists in every repository ever
# created — without a slug, the second repository onboarded would fight the
# first for the namespace `pr-1` and the hostname that goes with it.
#
# Fields:
#   slug        short, lowercase, DNS-safe. Appears in namespaces and URLs.
#   owner/repo  the GitHub repository to watch for pull requests
#   image       where its CI publishes; the platform appends :pr-<n>-<sha>
#   port        the port the application listens on
#   healthPath  what the readiness and liveness probes ask for
#
# The platform's GitHub token must be able to read pull requests in every
# repository listed here, or its environments silently never appear.

# Where the chart comes from. Deliberately this repository and not the
# onboarded one: an adopter should need a workflow call and four lines in the
# registry, not a vendored copy of a Helm chart they then have to keep in sync.
#
# It also closes an escalation path. When the chart came from the pull request
# under review, anyone able to open one could add a ClusterRoleBinding to it
# and have ArgoCD apply it with ArgoCD's own privileges. Sourcing the chart
# here means a pull request cannot influence its own deployment at all.
#
# The cost is real and worth stating: a pull request can no longer change how
# it is deployed, only what is deployed. For a platform serving other people's
# repositories that is the right way round.
platform:
  chartRepo: https://github.com/DevankSilswal/gitops-pr-preview.git
  chartRevision: main
  chartPath: charts/preview-app

repos:
  - slug: arcade
    owner: DevankSilswal
    repo: gitops-pr-preview
    image: ghcr.io/devanksilswal/preview-app
    port: 3000
    healthPath: /api/health

  # A second repository, onboarded without touching anything else here: a
  # different language, a different port, a different health path.
  - slug: notes
    owner: DevankSilswal
    repo: notes-board
    image: ghcr.io/devanksilswal/notes-board
    port: 8080
    healthPath: /healthz
