# The values the control plane is rendered from.
#
# These used to be environment variables read by scripts/render-argocd.rb at
# apply time, which meant the desired state existed only in whatever shell last
# ran the bootstrap. That is the drift this chart exists to end: on 2026-08-13
# the live cluster's ingress configuration, ApplicationSet and chart had each
# diverged from the repository in a different direction, and the ingress one
# took production down for the better part of an hour.
#
# GENERATED — do not edit by hand.
#
# Written by scripts/sync-base-host.sh from `terraform output -raw public_ip`,
# which reads azurerm_public_ip.main. That resource is the only authority on
# what address this platform answers on; this line is a copy of a decision made
# there, kept in git because ArgoCD renders the chart and cannot run Terraform.
#
# scripts/check-base-host.sh fails CI if this value is not something
# scripts/base-host.js would have produced, and if any other file starts
# carrying an endpoint of its own.
#
# When the VM is replaced: ./scripts/sync-base-host.sh --write, commit, then
# re-run bootstrap so the ApplicationSet and any wildcard certificate follow.
baseHost: 20-24-211-179.nip.io

# Where preview environments get their chart from. Mirrors
# deploy/platform/platform.yaml, which the ApplicationSet renderer still reads.
chartRepo: https://github.com/DevankSilswal/gitops-pr-preview.git

# cert-manager's ACME account address. Not a secret — it appears in every
# certificate this cluster has ever been issued.
acmeEmail: partner0ship@gmail.com

# TLS as the cluster runs it today. Per-host issuance, production issuer.
# Wildcard is P0-7; this chart must preserve current behaviour, not change it.
tls:
  enabled: true
  clusterIssuer: letsencrypt-prod

# What the drift checker holds the live cluster to. Rendered into its
# expectations ConfigMap, so the desired state it compares against is git's,
# kept current by ArgoCD rather than copied by hand.
driftCheck:
  # Every response header the preview chart may ask the ingress controller to
  # emit. ingress-nginx denies the entire location for an unlisted header, so a
  # mismatch here is not a degradation — it is a 503 on every host the
  # controller serves. This list must stay equal to
  # deploy/platform/ingress-nginx-values.yaml; scripts/check-ingress-headers.sh
  # is what keeps the chart from asking for anything outside it.
  requiredResponseHeaders:
    - X-Robots-Tag

# The StackPreview control plane.
#
# Off by default, and enabling it is two decisions rather than one. `enabled`
# puts a new workload on a node already at 73% memory; `ingress.enabled` puts an
# endpoint that can create environments on the internet, and must not be turned
# on before the GitHub App's webhook secret exists — the process refuses to
# start in that combination.
controlPlane:
  enabled: false
  namespace: stackpreview
  storage: 1Gi
  maxEnvironments: 8
  # Stays false until the cluster has a preview secret salt. With it false the
  # product downgrades a private preview to public and says why, rather than
  # letting a reviewer believe unreleased work is protected.
  privatePreviewsAvailable: false
  # Namespace the ingress controller runs in; the only source allowed to reach
  # the control plane.
  ingressNamespace: ingress-nginx
  image:
    repository: ghcr.io/devanksilswal/stackpreview-control-plane
    tag: main
  # Created by hand, never by this chart and never in git:
  #   kubectl create secret generic stackpreview-github-app -n stackpreview \
  #     --from-literal=app-id=... \
  #     --from-literal=webhook-secret=... \
  #     --from-file=private-key.pem=...
  secretName: stackpreview-github-app
  ingress:
    enabled: false
    subdomain: stackpreview
