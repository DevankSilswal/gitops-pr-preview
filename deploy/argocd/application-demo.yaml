# The permanent demo environment — the URL that has to work at 3am.
#
# Deliberately NOT a pinned pull request. A label on an open pull request is
# still a lifecycle that somebody can end by clicking Close, and closing it is
# exactly what happened on 2026-08-13: two pull requests were closed within
# twenty seconds and every demo link in the repository went to a 404 served by
# the ingress controller's default certificate. A demo that depends on a pull
# request staying open is not permanent, it is merely unexpired.
#
# So this is an Application in its own right, the way production is. Nothing
# generated it, so nothing can prune it: the ApplicationSet only manages the
# Applications it templates from open labelled pull requests, and the TTL sweep
# in preview-lifecycle.yml only removes labels from pull requests. Neither one
# can reach this object. That is a structural guarantee rather than a policy —
# there is no code path from "a pull request changed" to "the demo disappeared".
#
# It runs the same chart every preview runs, so it is subject to the same
# ResourceQuota, LimitRange, NetworkPolicy and Pod Security Admission. A demo
# exempt from the platform's own constraints would be demonstrating something
# other than the platform.
#
# The image comes from values-production.yaml, which CI rewrites on every merge
# to main. The demo therefore tracks the promoted release automatically and can
# never be pinned to a stale image that quietly rots — the failure mode of every
# long-lived demo environment.
#
# One replica, not two. Production keeps two so a rollout has somewhere to send
# traffic; this node has 4 GB and is already at 76% memory, and a second replica
# here would buy less than it costs. A pod failure is recovered by the
# Deployment; a node failure takes production down too, and is documented in
# docs/runbook.md rather than pretended away.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: preview-app-demo
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  labels:
    # The explicit lifecycle state. Nothing keys off this yet; it exists so a
    # human reading `kubectl get applications -n argocd -L preview.lifecycle`
    # can tell at a glance which environments are supposed to outlive a pull
    # request, and so a future reaper has something unambiguous to refuse.
    preview.lifecycle: pinned
spec:
  project: default
  source:
    repoURL: https://github.com/DevankSilswal/gitops-pr-preview.git
    targetRevision: main
    path: charts/preview-app
    helm:
      valueFiles:
        - values-production.yaml
      parameters:
        - name: image.repository
          value: ghcr.io/devanksilswal/preview-app
        - name: environment
          value: demo
        - name: prNumber
          value: "none"
        - name: replicaCount
          value: "1"
        - name: ingress.host
          value: "demo.__PREVIEW_BASE_HOST__"
        - name: ingress.tls.enabled
          value: "__TLS_ENABLED__"
        - name: ingress.tls.clusterIssuer
          value: "__TLS_ISSUER__"
  destination:
    server: https://kubernetes.default.svc
    namespace: demo
  syncPolicy:
    automated:
      # selfHeal is what makes the recovery claim in the README true rather than
      # aspirational: delete the Deployment and ArgoCD puts it back without
      # anybody being paged.
      prune: true
      selfHeal: true
    syncOptions:
      # The namespace outlives any single release, so it is not the chart's to
      # own and delete — same reasoning as production.
      - CreateNamespace=true
