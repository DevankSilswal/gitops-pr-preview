# The long-lived environment tracking the main branch.
#
# Same chart and same mechanism as a preview environment; this one follows a
# branch instead of a pull request. That symmetry is the point — merging a pull
# request promotes the artefact that was actually reviewed.
#
# The deployed image tag lives in charts/preview-app/values-production.yaml
# rather than here, because CI rewrites that file and commits it. Pinning a
# mutable tag like `latest` in this manifest instead would mean the cluster's
# state could not be read back out of the repository, and ArgoCD would have no
# way to tell that a release had happened.
#
# The repository and image are written out rather than templated from the
# onboarded registry, because this is one specific deployment of one specific
# application — not something the platform does generically. Only the cluster's
# own base hostname and TLS issuer are filled in at apply time by
# scripts/render-argocd.rb.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: preview-app-prod
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/DevankSilswal/gitops-pr-preview.git
    targetRevision: main
    path: charts/preview-app
    helm:
      valueFiles:
        - values-production.yaml
      parameters:
        - name: image.repository
          value: ghcr.io/devanksilswal/preview-app
        - name: ingress.host
          value: "app.__PREVIEW_BASE_HOST__"
        - name: ingress.tls.enabled
          value: "__TLS_ENABLED__"
        - name: ingress.tls.clusterIssuer
          value: "__TLS_ISSUER__"
  destination:
    server: https://kubernetes.default.svc
    namespace: production
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      # Unlike a preview, this namespace outlives any single release, so it is
      # not the chart's to own and delete.
      - CreateNamespace=true
