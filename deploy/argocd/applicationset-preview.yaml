# One preview environment per open pull request, across every onboarded
# repository.
#
# The generator is a matrix: every file in deploy/platform/onboarded/, crossed
# with the pull requests open in the repository each one describes.
#
# ArgoCD reads that directory itself, so onboarding is a commit and nothing
# more — no command against the cluster, no re-bootstrap, no edit to this file.
# Removing a repository is deleting its file, and every environment it had goes
# with it on the next poll.
#
# When a pull request is closed, or loses its label, the generator stops
# emitting it, the controller deletes the Application, and the finalizer
# cascades that deletion to everything it created. Nothing tears environments
# down imperatively.
#
# The placeholders below are filled in at apply time by
# scripts/render-argocd.rb.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: preview-environments
  namespace: argocd
spec:
  generators:
    - matrix:
        generators:
          - git:
              repoURL: __CHART_REPO__
              revision: __CHART_REVISION__
              files:
                - path: "deploy/platform/onboarded/*.yaml"
              # Poll rather than wait for a webhook, so this works on a cluster
              # GitHub cannot reach.
              requeueAfterSeconds: 120
          - pullRequest:
              github:
                owner: "{{owner}}"
                repo: "{{repo}}"
                # Only labelled pull requests get an environment. CI adds the
                # label when one opens and a scheduled job removes it once the
                # pull request goes stale, so expiry is a change in desired
                # state rather than a reaper racing this controller.
                labels:
                  - preview
                tokenRef:
                  secretName: github-token
                  key: token
              # How quickly a newly labelled pull request gets an environment.
              requeueAfterSeconds: 60

  template:
    metadata:
      # The slug is what stops two repositories colliding. Pull request #1
      # exists in every repository ever created; without it, the second
      # repository onboarded would take over the first one's namespace.
      name: "preview-{{slug}}-{{number}}"
      finalizers:
        # Without this, deleting the Application orphans its resources and the
        # environment keeps running after the pull request is closed.
        - resources-finalizer.argocd.argoproj.io
    spec:
      project: previews
      source:
        # The chart comes from the platform, not from the repository under
        # review. An adopter therefore vendors nothing, and a pull request
        # cannot alter how it is deployed — only what is deployed.
        repoURL: __CHART_REPO__
        targetRevision: __CHART_REVISION__
        path: __CHART_PATH__
        helm:
          parameters:
            - name: image.repository
              value: "{{image}}"
            # Must match the tag the reusable build workflow publishes.
            - name: image.tag
              value: "pr-{{number}}-{{head_sha}}"
            - name: environment
              value: "{{slug}}-pr-{{number}}"
            - name: prNumber
              value: "{{number}}"
            - name: gitSha
              value: "{{head_sha}}"
            # Where the application listens and what the probes ask for. Every
            # onboarded application differs here.
            - name: service.targetPort
              value: "{{port}}"
            - name: healthPath
              value: "{{healthPath}}"
            - name: ingress.host
              value: "{{slug}}-pr-{{number}}.__PREVIEW_BASE_HOST__"
            # Makes the namespace part of the release so pruning removes it.
            - name: namespace.create
              value: "true"
            - name: ingress.tls.enabled
              value: "__TLS_ENABLED__"
            - name: ingress.tls.clusterIssuer
              value: "__TLS_ISSUER__"
      destination:
        server: https://kubernetes.default.svc
        namespace: "{{slug}}-pr-{{number}}"
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        # Deliberately no CreateNamespace=true: the chart owns the namespace so
        # that pruning can remove it. See charts/preview-app/templates/namespace.yaml.
        syncOptions: []
        retry:
          # CI needs a minute or two to publish the image; until it exists the
          # sync fails with ImagePullBackOff. Back off and retry instead of
          # leaving the environment broken.
          limit: 10
          backoff:
            duration: 30s
            factor: 2
            maxDuration: 5m
