namespace:
  # ArgoCD sets this so the namespace becomes a pruneable part of the release.
  # Left off for plain `helm install`, where the namespace usually already
  # exists and is not the chart's to own.
  create: false

replicaCount: 1

image:
  # Overridden per environment by ArgoCD. Must stay lowercase.
  repository: ghcr.io/devanksilswal/preview-app
  tag: latest
  pullPolicy: IfNotPresent

# Deploy-time identity. The ApplicationSet overrides these per pull request;
# GIT_SHA and BUILT_AT are not set here because they are baked into the image
# at build time by CI (see the ARGs in app/Dockerfile).
environment: local
prNumber: "none"

service:
  port: 80
  # The port the application listens on. Nothing in this chart assumes 3000
  # beyond this default.
  targetPort: 3000

# What the probes ask for. Every onboarded application exposes something
# different here — /healthz, /health, or just / for a static site — so it is a
# value rather than a convention baked into the templates.
healthPath: /api/health

ingress:
  enabled: true
  className: nginx
  # Set per environment, e.g. pr-42.<node-ip>.nip.io
  host: ""
  tls:
    # Off by default so a cluster without cert-manager still works. Let's
    # Encrypt also rate-limits heavily, and preview environments churn through
    # hostnames faster than almost any other workload.
    enabled: false
    clusterIssuer: letsencrypt-staging

networkPolicy:
  enabled: true
  # Namespace the ingress controller runs in; the only source allowed to reach
  # a preview environment.
  ingressNamespace: ingress-nginx

quota:
  enabled: true
  hard:
    pods: "4"
    requests.cpu: "500m"
    requests.memory: 512Mi
    limits.cpu: "2"
    limits.memory: 1Gi
  defaultRequests:
    cpu: 25m
    memory: 48Mi
  defaultLimits:
    cpu: 200m
    memory: 128Mi
  maxPerContainer:
    cpu: "1"
    memory: 512Mi

podSecurityAdmission:
  enabled: true
  # `restricted` is what the pods here already satisfy: non-root, no privilege
  # escalation, all capabilities dropped, the RuntimeDefault seccomp profile.
  # Enforcing it means the API server rejects anything that stops satisfying it
  # rather than the chart quietly not asking.
  level: restricted

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001
  seccompProfile:
    type: RuntimeDefault

containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

# Kept small on purpose: a single free-tier node has to hold many
# concurrent preview environments.
resources:
  requests:
    cpu: 25m
    memory: 48Mi
  limits:
    cpu: 200m
    memory: 128Mi
