# What production is running, as a file in git.
#
# CI rewrites image.tag here on every merge to main and commits it. That commit
# is the deployment: ArgoCD notices it and rolls the change out. Nothing in the
# pipeline ever holds cluster credentials, and `git log` on this file is the
# deployment history — including how to roll back, which is a revert.
#
# The obvious alternative, pointing production at a `latest` tag, breaks both
# of those properties: the cluster's state stops being derivable from the
# repository, and ArgoCD cannot tell that anything changed.
image:
  tag: main-fdca7861629bf3e4b8d66b88e6aeaef5b7af40cd

environment: production
prNumber: "none"

# Two replicas so a rollout, an eviction or a node drain has somewhere to send
# traffic. Preview environments deliberately stay at one — they are disposable,
# and a second replica each would cost more than the whole fleet is worth.
replicaCount: 2
