apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "preview-app.fullname" . }}
  labels:
    {{- include "preview-app.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "preview-app.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "preview-app.labels" . | nindent 8 }}
    spec:
      # The app traps SIGTERM and closes its listener, so pods drain quickly
      # when a pull request is closed and the environment is torn down.
      terminationGracePeriodSeconds: 20
      containers:
        - name: app
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.targetPort }}
          env:
            - name: ENVIRONMENT
              value: {{ .Values.environment | quote }}
            - name: PR_NUMBER
              value: {{ .Values.prNumber | quote }}
            {{- if .Values.gitSha }}
            - name: GIT_SHA
              value: {{ .Values.gitSha | quote }}
            {{- end }}
            {{- if .Values.builtAt }}
            - name: BUILT_AT
              value: {{ .Values.builtAt | quote }}
            {{- end }}
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
