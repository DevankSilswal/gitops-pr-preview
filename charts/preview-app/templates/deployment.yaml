apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "preview-app.fullname" . }}
  labels:
    {{- include "preview-app.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      # Never drop below the desired count during a rollout. The default
      # allows one pod to go away before its replacement is ready, which on a
      # single-replica deployment is a gap with no server behind the URL —
      # every release visibly failing for whoever happens to be looking.
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      {{- include "preview-app.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "preview-app.labels" . | nindent 8 }}
    spec:
      # The app traps SIGTERM and closes its listener, so pods drain quickly
      # when a pull request is closed and the environment is torn down.
      terminationGracePeriodSeconds: 20
      # Preview environments run code from unmerged branches, which is the
      # least trusted code in the system. Anything it can be denied, it is.
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: app
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: {{ .Values.service.targetPort }}
          env:
            - name: ENVIRONMENT
              value: {{ .Values.environment | quote }}
            - name: PR_NUMBER
              value: {{ .Values.prNumber | quote }}
            {{- if .Values.gitSha }}
            - name: GIT_SHA
              value: {{ .Values.gitSha | quote }}
            {{- end }}
            {{- if .Values.builtAt }}
            - name: BUILT_AT
              value: {{ .Values.builtAt | quote }}
            {{- end }}
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            # The root filesystem is read-only, so give the runtime somewhere
            # legitimate to write.
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
