{{- if .Values.namespace.create -}}
# The namespace is part of the release rather than something ArgoCD conjures
# via CreateNamespace=true. A namespace created that way is untracked, so it
# survives pruning and every pull request ever opened leaves an empty namespace
# behind forever. Templating it here makes ArgoCD its owner, so deleting the
# Application deletes the namespace and everything still inside it.
#
# The negative sync wave guarantees it exists before anything is placed in it.
apiVersion: v1
kind: Namespace
metadata:
  name: {{ .Release.Namespace }}
  labels:
    {{- include "preview-app.labels" . | nindent 4 }}
    {{- if .Values.podSecurityAdmission.enabled }}
    # Enforced by the API server, not by the chart. The chart already sets a
    # locked-down security context, but a chart is only a request — this is the
    # cluster refusing anything that does not meet the baseline, including
    # whatever a pull request might add to its own namespace later.
    pod-security.kubernetes.io/enforce: {{ .Values.podSecurityAdmission.level }}
    pod-security.kubernetes.io/audit: {{ .Values.podSecurityAdmission.level }}
    pod-security.kubernetes.io/warn: {{ .Values.podSecurityAdmission.level }}
    {{- end }}
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
{{- end }}
