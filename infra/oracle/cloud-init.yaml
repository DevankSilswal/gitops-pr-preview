#cloud-config
package_update: true

runcmd:
  # Oracle's Ubuntu images ship iptables rules that drop everything except SSH.
  # The security list alone is not enough — without this, every preview URL
  # times out even though the cluster is healthy. This is the single most
  # common reason an OCI k3s setup "works" but is unreachable.
  - iptables -I INPUT 1 -p tcp --dport 80 -j ACCEPT
  - iptables -I INPUT 1 -p tcp --dport 443 -j ACCEPT
  - iptables -I INPUT 1 -p tcp --dport 6443 -j ACCEPT
  - netfilter-persistent save

  # k3s ships Traefik by default; we standardise on ingress-nginx instead so the
  # ingress annotations here match what any other Kubernetes cluster expects.
  - curl -sfL https://get.k3s.io | INSTALL_K3S_EXEC="--disable traefik --write-kubeconfig-mode 644" sh -
  - until kubectl get nodes >/dev/null 2>&1; do sleep 5; done
  - kubectl wait --for=condition=Ready node --all --timeout=300s
