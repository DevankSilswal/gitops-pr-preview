#cloud-config
package_update: true

runcmd:
  # No iptables surgery here, unlike the Oracle image: Azure's Ubuntu images
  # ship with an open local firewall and the network security group is what
  # actually gates traffic.

  # k3s ships Traefik by default; we standardise on ingress-nginx so the
  # ingress annotations match what any other Kubernetes cluster expects.
  - curl -sfL https://get.k3s.io | INSTALL_K3S_EXEC="--disable traefik --write-kubeconfig-mode 644" sh -
  - until kubectl get nodes >/dev/null 2>&1; do sleep 5; done
  - kubectl wait --for=condition=Ready node --all --timeout=300s
