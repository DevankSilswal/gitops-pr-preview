<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>StackPreview</title>
<style>
  :root {
    --bg: #fbfbfa; --panel: #fff; --line: #e6e4e0; --ink: #1c1b19; --muted: #6b6862;
    --ok: #1a7f4b; --warn: #a86b00; --bad: #b4392b; --busy: #2b62b4;
    --radius: 10px;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#191817; --panel:#221f1e; --line:#37332f; --ink:#eeece8; --muted:#a09a92;
            --ok:#54c78a; --warn:#e0a13a; --bad:#e8705f; --busy:#71a6ef; }
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:15px/1.5 ui-sans-serif,-apple-system,Segoe UI,Roboto,sans-serif; }
  header { display:flex; align-items:center; gap:12px; padding:14px 22px; border-bottom:1px solid var(--line); }
  header h1 { font-size:16px; margin:0; font-weight:650; letter-spacing:-.01em; }
  header .who { margin-left:auto; color:var(--muted); font-size:13px; display:flex; align-items:center; gap:10px; }
  main { max-width:1080px; margin:0 auto; padding:22px; }
  .row { display:grid; grid-template-columns:repeat(auto-fit,minmax(180px,1fr)); gap:12px; margin-bottom:22px; }
  .tile { background:var(--panel); border:1px solid var(--line); border-radius:var(--radius); padding:14px 16px; }
  .tile .k { color:var(--muted); font-size:12px; text-transform:uppercase; letter-spacing:.05em; }
  .tile .v { font-size:26px; font-weight:600; margin-top:4px; font-variant-numeric:tabular-nums; }
  .tile .sub { color:var(--muted); font-size:12px; margin-top:2px; }
  section { background:var(--panel); border:1px solid var(--line); border-radius:var(--radius); margin-bottom:18px; overflow:hidden; }
  section h2 { font-size:13px; margin:0; padding:12px 16px; border-bottom:1px solid var(--line);
               color:var(--muted); text-transform:uppercase; letter-spacing:.05em; font-weight:600; }
  table { width:100%; border-collapse:collapse; }
  td, th { padding:11px 16px; text-align:left; border-bottom:1px solid var(--line); font-size:14px; }
  th { color:var(--muted); font-weight:500; font-size:12px; }
  tr:last-child td { border-bottom:0; }
  tr.clickable { cursor:pointer; }
  tr.clickable:hover { background:color-mix(in srgb, var(--ink) 4%, transparent); }
  .badge { display:inline-block; padding:2px 9px; border-radius:99px; font-size:12px; font-weight:600;
           border:1px solid currentColor; }
  .s-READY{color:var(--ok)} .s-FAILED,.s-REJECTED{color:var(--bad)}
  .s-BUILDING,.s-PROVISIONING,.s-UPDATING,.s-QUEUED{color:var(--busy)}
  .s-EXPIRING,.s-DESTROYING{color:var(--warn)} .s-DESTROYED{color:var(--muted)}
  .mono { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:13px; }
  .muted { color:var(--muted); }
  a { color:inherit; }
  button { font:inherit; padding:7px 13px; border-radius:8px; border:1px solid var(--line);
           background:var(--panel); color:var(--ink); cursor:pointer; }
  button:hover:not(:disabled) { background:color-mix(in srgb, var(--ink) 6%, transparent); }
  button:disabled { opacity:.45; cursor:not-allowed; }
  button.primary { background:var(--ink); color:var(--bg); border-color:var(--ink); }
  button.danger { color:var(--bad); }
  .actions { display:flex; gap:8px; padding:14px 16px; flex-wrap:wrap; }
  .kv { display:grid; grid-template-columns:170px 1fr; gap:9px 16px; padding:14px 16px; }
  .kv dt { color:var(--muted); font-size:13px; }
  .kv dd { margin:0; font-size:14px; }
  pre { margin:0; padding:14px 16px; overflow-x:auto; font-size:12.5px; line-height:1.55;
        background:color-mix(in srgb, var(--ink) 4%, transparent); }
  .failure { border-left:3px solid var(--bad); padding:14px 16px; }
  .failure h3 { margin:0 0 6px; font-size:14px; }
  .empty { padding:28px 16px; text-align:center; color:var(--muted); font-size:14px; }
  .signin { max-width:420px; margin:14vh auto; text-align:center; }
  .signin p { color:var(--muted); }
  nav.crumbs { padding:0 0 14px; font-size:13px; color:var(--muted); }
  nav.crumbs a { text-decoration:none; }
</style>
</head>
<body>
<header>
  <h1>StackPreview</h1>
  <div class="who" id="who"></div>
</header>
<main id="app"><div class="empty">Loading…</div></main>
<script src="/dashboard/app.js"></script>
</body>
</html>
