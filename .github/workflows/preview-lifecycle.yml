name: preview-lifecycle

# Controls which pull requests are entitled to a preview environment.
#
# The ApplicationSet only generates Applications for PRs labelled `preview`, so
# adding and removing that label is the entire lifecycle API. Expiry is
# therefore declarative: nothing here deletes a namespace: removing the label
# changes desired state and ArgoCD prunes the environment on its own.

on:
  pull_request_target:
    types: [opened, reopened]
  schedule:
    # Hourly sweep for environments whose PR has gone quiet.
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      ttl_days:
        description: 'Override the TTL for this run. 0 expires every idle environment immediately.'
        required: false
        default: ''

permissions:
  pull-requests: write

env:
  # A preview environment expires after this many days without a push.
  TTL_DAYS: 3
  # How many may exist at once. Per-namespace quotas stop one environment
  # starving another, but nothing stops the tenth from exhausting a single
  # node — this is where that bound lives, because the label is what admits an
  # environment in the first place.
  MAX_ENVIRONMENTS: 8

jobs:
  grant:
    if: github.event_name == 'pull_request_target'
    runs-on: ubuntu-latest
    steps:
      # This job runs on pull_request_target, which carries write permissions.
      # It therefore never checks out or executes the pull request's code — it
      # only reads event metadata. Building a fork's code under this trigger
      # would hand a stranger's branch a token that can push images and write
      # to the repository, which is precisely the supply-chain attack the
      # trigger is infamous for.
      - uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          # A repository variable overrides the default, so the cap can be
          # raised for a bigger node — or dropped to exercise the refusal path
          # — without editing this file.
          MAX_ENVIRONMENTS: ${{ vars.MAX_ENVIRONMENTS || env.MAX_ENVIRONMENTS }}
        with:
          script: |
            const pr = context.payload.pull_request;
            const { owner, repo } = context.repo;

            // Dependency bumps do not need somewhere to click. Left alone they
            // arrive several at a time and take most of the capacity of a
            // single-node cluster; label one by hand on the rare occasion a
            // bump is worth looking at.
            if (pr.user.type === 'Bot') {
              core.info(`#${pr.number} was opened by ${pr.user.login}; no environment`);
              return;
            }

            // A fork's build runs with a read-only token, so it cannot publish
            // the image the environment needs. Say so, rather than granting a
            // label that produces an environment stuck on ImagePullBackOff.
            if (pr.head.repo.full_name !== `${owner}/${repo}`) {
              await github.rest.issues.createComment({
                owner, repo, issue_number: pr.number,
                body: [
                  'No preview environment for this pull request.',
                  '',
                  'It comes from a fork, and builds triggered by forks get a',
                  'read-only token that cannot publish to the registry. Building',
                  'it with write access would mean running an unreviewed branch',
                  'with credentials that can push images to this repository.',
                  '',
                  'A maintainer can push the branch here to get an environment.',
                ].join('\n'),
              });
              core.info(`PR #${pr.number} is from a fork; no label granted`);
              return;
            }

            // Refuse past the cap rather than letting the node decide by
            // evicting somebody's environment mid-review.
            // Number(undefined) is NaN and every comparison against it is
            // false, so a missing value would disable the cap silently rather
            // than loudly. Fail instead.
            const max = Number(process.env.MAX_ENVIRONMENTS);
            if (!Number.isInteger(max) || max < 1) {
              core.setFailed(`MAX_ENVIRONMENTS must be a positive integer, got '${process.env.MAX_ENVIRONMENTS}'`);
              return;
            }
            const open = await github.paginate(github.rest.pulls.list, {
              owner, repo, state: 'open', per_page: 100,
            });
            const active = open.filter((p) => p.labels.some((l) => l.name === 'preview'));

            if (active.length >= max) {
              await github.rest.issues.createComment({
                owner, repo, issue_number: pr.number,
                body: [
                  `No preview environment yet — ${active.length} of ${max} are already running.`,
                  '',
                  'The cluster is a single node, so environments are capped rather',
                  'than allowed to evict each other. One will free up when another',
                  'pull request is closed or goes idle past its TTL, or you can add',
                  'the `preview` label by hand to take a slot now.',
                ].join('\n'),
              });
              core.info(`at capacity (${active.length}/${max}); no label granted for #${pr.number}`);
              return;
            }

            await github.rest.issues.addLabels({
              owner, repo, issue_number: pr.number, labels: ['preview'],
            });
            core.info(`granted preview to #${pr.number} (${active.length + 1}/${max})`);

  expire:
    if: github.event_name != 'pull_request_target'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          TTL_OVERRIDE: ${{ inputs.ttl_days }}
        with:
          script: |
            // The override exists so the sweep can be exercised on demand
            // rather than only being observed days later on the schedule.
            const ttlDays = Number(process.env.TTL_OVERRIDE || process.env.TTL_DAYS);
            if (!Number.isFinite(ttlDays) || ttlDays < 0) {
              core.setFailed(`invalid ttl_days: ${process.env.TTL_OVERRIDE}`);
              return;
            }
            core.info(`expiring preview environments idle for more than ${ttlDays} day(s)`);
            const cutoff = Date.now() - ttlDays * 24 * 60 * 60 * 1000;

            const prs = await github.paginate(github.rest.pulls.list, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100,
            });

            for (const pr of prs) {
              const labelled = pr.labels.some((l) => l.name === 'preview');
              if (!labelled) continue;

              // updated_at moves on pushes, comments and reviews, so an active
              // review keeps its environment alive without any manual renewal.
              if (new Date(pr.updated_at).getTime() >= cutoff) continue;

              await github.rest.issues.removeLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pr.number,
                name: 'preview',
              });

              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pr.number,
                body: [
                  `Preview environment expired after ${ttlDays} days without activity.`,
                  '',
                  'Add the `preview` label to bring it back.',
                ].join('\n'),
              });

              core.info(`expired preview for PR #${pr.number}`);
            }
