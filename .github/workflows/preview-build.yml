name: preview-build

# Publishes the image a preview environment needs, for any repository.
#
# Adopting the platform should not mean reverse-engineering someone else's CI.
# Everything the tag convention depends on lives here, so a repository opts in
# with a few lines:
#
#   jobs:
#     preview:
#       uses: DevankSilswal/gitops-pr-preview/.github/workflows/preview-build.yml@main
#       with:
#         image-name: my-app
#         context: .
#       permissions:
#         contents: read
#         packages: write
#         pull-requests: write
#
# This repository calls it too, so the path adopters take is the one exercised
# on every commit here rather than a parallel copy left to rot.

on:
  workflow_call:
    inputs:
      image-name:
        description: 'Image name under ghcr.io/<owner>/'
        required: true
        type: string
      context:
        description: 'Build context directory'
        required: false
        default: '.'
        type: string
      dockerfile:
        description: 'Dockerfile path, relative to the repository root'
        required: false
        default: ''
        type: string
      platforms:
        description: 'Architectures to build for. The default covers both the ARM and x86 nodes this platform runs on.'
        required: false
        default: 'linux/amd64,linux/arm64'
        type: string
      slug:
        description: >-
          Override the slug this repository is onboarded under. Leave it alone:
          the default is derived exactly as discovery derives it, so the link
          this posts and the hostname that exists cannot disagree.
        required: false
        default: ''
        type: string
      health-timeout-seconds:
        description: >-
          How long to wait for the environment to return 200 before commenting.
          The link is still posted afterwards, marked as still starting.
        required: false
        default: 240
        type: number
      preview-base-host:
        description: 'Base hostname of the cluster, e.g. 20-24-211-179.nip.io. Leave empty to skip the pull request comment.'
        required: false
        default: ''
        type: string
      scheme:
        description: 'http or https, for the link in the comment'
        required: false
        default: 'https'
        type: string
      manage-label:
        description: >-
          Create and apply the `preview` label to the pull request. Leave on for
          an adopting repository, where nothing else does it. Turn off where a
          lifecycle workflow already grants the label with its own rules.
        required: false
        default: true
        type: boolean
      max-environments:
        description: >-
          How many environments this repository may hold at once. The cluster
          is shared, so a repository with thirty open pull requests would
          otherwise take capacity everyone else needs. Four repositories at
          this cap reach the point where TooManyPreviewEnvironments fires; see
          docs/capacity.md.
        required: false
        default: 3
        type: number
      fail-on-vulnerabilities:
        description: 'Fail the build on fixable HIGH or CRITICAL findings'
        required: false
        default: true
        type: boolean
      preview-test:
        description: >-
          A command to run against the live preview URL once it answers. The
          URL is in $PREVIEW_URL, and the credentials in $PREVIEW_USER and
          $PREVIEW_PASSWORD. A non-zero exit fails the check, which is what
          turns a preview from a link somebody might click into evidence the
          change works. Empty skips it.
        required: false
        default: ''
        type: string
      preview-test-directory:
        description: 'Working directory for preview-test'
        required: false
        default: '.'
        type: string
    secrets:
      preview-secret-salt:
        description: >-
          The cluster's secret salt, from bootstrap-cluster.sh. Preview
          environments are password-protected and the password is derived from
          this rather than stored, so CI needs the same value to tell the
          reviewer what it is. Without it the environment still deploys — the
          chart turns auth off when it has no salt either.
        required: false
    outputs:
      image:
        description: 'Full image repository that was published to'
        value: ${{ jobs.build.outputs.image }}
      tag:
        description: 'Tag that was published'
        value: ${{ jobs.build.outputs.tag }}
      url:
        description: 'Preview URL, if one was advertised'
        value: ${{ jobs.build.outputs.url }}
      ready:
        description: 'Whether the environment answered 200 before the timeout'
        value: ${{ jobs.build.outputs.ready }}
      provisioning-seconds:
        description: >-
          Seconds from the pull request being opened to its environment serving
          200. This is the platform's own SLI — the promise it makes is "open a
          pull request, get a working URL", and this is that promise measured.
        value: ${{ jobs.build.outputs.provisioning_seconds }}

jobs:
  build:
    runs-on: ubuntu-latest
    # Emulated arm64 builds are slow; this is generous, but not unbounded.
    timeout-minutes: 45
    # A fork's token cannot write packages, so the push would fail after
    # several minutes of building. Skipping is honest — the caller's own tests
    # still gate the pull request.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    outputs:
      image: ${{ steps.meta.outputs.image }}
      tag: ${{ steps.meta.outputs.tag }}
      url: ${{ steps.health.outputs.url }}
      ready: ${{ steps.health.outputs.ready }}
      provisioning_seconds: ${{ steps.health.outputs.provisioning_seconds }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # On pull_request GitHub checks out a synthetic merge commit whose
          # SHA nothing else knows about. ArgoCD deploys the pull request
          # *head*, so build that same commit or the tag is never found.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Compute image tag and build metadata
        id: meta
        env:
          REGISTRY: ghcr.io
        run: |
          set -euo pipefail

          # Container registries reject uppercase in image names and GitHub
          # usernames are frequently mixed case. Actions has no lower().
          OWNER_LC=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "image=${REGISTRY}/${OWNER_LC}/${{ inputs.image-name }}" >> "$GITHUB_OUTPUT"

          SHA="${{ github.event.pull_request.head.sha || github.sha }}"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            # The ApplicationSet rebuilds this exact string from {{number}} and
            # {{head_sha}}. Full SHAs on both sides, so nothing can truncate
            # differently at either end.
            echo "tag=pr-${{ github.event.number }}-${SHA}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=main-${SHA}" >> "$GITHUB_OUTPUT"
          fi
          echo "sha=${SHA}" >> "$GITHUB_OUTPUT"
          echo "built_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

          # Derived the same way scripts/discover-repos.rb derives it, from
          # owner and repository. Passing a slug by hand is how this last broke:
          # the comment advertised a hostname that had never existed, on the one
          # feature the whole platform is for.
          if [ -n "${{ inputs.slug }}" ]; then
            SLUG="${{ inputs.slug }}"
          else
            SLUG=$(printf '%s' "${{ github.repository }}" \
              | tr '[:upper:]' '[:lower:]' \
              | sed -E 's#[^a-z0-9]+#-#g; s#^-+|-+$##g')
            if [ ${#SLUG} -gt 45 ]; then
              DIGEST=$(printf '%s' "$SLUG" | shasum -a 256 | cut -c1-6)
              SLUG="${SLUG:0:38}-${DIGEST}"
            fi
          fi
          echo "slug=${SLUG}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfile != '' && inputs.dockerfile || format('{0}/Dockerfile', inputs.context) }}
          platforms: ${{ inputs.platforms }}
          push: true
          tags: ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}
          # Applications that want to report their own identity can read these;
          # nothing breaks for one that ignores them.
          build-args: |
            GIT_SHA=${{ steps.meta.outputs.sha }}
            BUILT_AT=${{ steps.meta.outputs.built_at }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Scanning after the push rather than before is deliberate: what gets
      # scanned is then byte-for-byte what a preview environment will run.
      - name: Scan the published image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: ${{ inputs.fail-on-vulnerabilities && '1' || '0' }}
          format: table

      # An environment exists exactly while its pull request carries this
      # label, so in a repository with no lifecycle workflow of its own this is
      # what admits it. The label is granted after the image is published, not
      # before: labelling first produces an environment that sits in
      # ImagePullBackOff until the build catches up.
      #
      # Note the limit: this cannot see other repositories, so the cluster-wide
      # cap in preview-lifecycle.yml does not apply here. The
      # TooManyPreviewEnvironments alert is what catches a shared cluster
      # filling up.
      - name: Grant the preview label
        if: github.event_name == 'pull_request' && inputs.manage-label
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          MAX_ENVIRONMENTS: ${{ inputs.max-environments }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const pr = context.payload.pull_request;

            // The cluster is shared and one node. Refusing here is the only
            // preventive control the platform has over a repository it does
            // not own — it cannot manage labels in somebody else's project,
            // only decline to grant one from its own workflow.
            const max = Number(process.env.MAX_ENVIRONMENTS);
            if (!Number.isInteger(max) || max < 1) {
              core.setFailed(`max-environments must be a positive integer, got '${process.env.MAX_ENVIRONMENTS}'`);
              return;
            }

            const open = await github.paginate(github.rest.pulls.list, {
              owner, repo, state: 'open', per_page: 100,
            });
            const active = open.filter(
              (p) => p.number !== pr.number && p.labels.some((l) => l.name === 'preview'),
            );

            if (active.length >= max) {
              await github.rest.issues.createComment({
                owner, repo, issue_number: pr.number,
                body: [
                  `No preview environment yet — this repository already has ${active.length} of ${max}.`,
                  '',
                  'Environments run on a shared single-node cluster, so they are',
                  'capped per repository rather than allowed to crowd each other',
                  'out. One frees up when another pull request is closed or goes',
                  'idle. Adding the `preview` label by hand takes a slot now.',
                ].join('\n'),
              });
              core.info(`at capacity (${active.length}/${max}); no label granted`);
              return;
            }

            try {
              await github.rest.issues.getLabel({ owner, repo, name: 'preview' });
            } catch (e) {
              if (e.status !== 404) throw e;
              await github.rest.issues.createLabel({
                owner, repo,
                name: 'preview',
                color: '0e8a16',
                description: 'Entitles this pull request to a preview environment',
              });
            }

            await github.rest.issues.addLabels({
              owner, repo, issue_number: pr.number, labels: ['preview'],
            });
            core.info(`granted preview to #${pr.number} (${active.length + 1}/${max})`);

      - name: Summary
        run: |
          echo "Image \`${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}\`" >> "$GITHUB_STEP_SUMMARY"

      # Wait for the environment to actually answer before advertising it.
      #
      # ArgoCD needs a minute to notice the label, and ingress-nginx replies
      # with its own 404 page the moment a hostname exists but its route does
      # not — so a link posted immediately is a link that does not work yet.
      # This is the same mistake that made the end-to-end test flaky: treating
      # "something responded" as "it is ready".
      # The preview password, derived rather than fetched.
      #
      # The chart computes the same value from the same salt and the same
      # environment identity, so this can tell the reviewer the password
      # without CI ever holding cluster credentials — which is the property the
      # whole pipeline is built around. Keep the formula in step with
      # preview-app.derivedSecret in charts/preview-app/templates/_helpers.tpl.
      - name: Derive the preview credentials
        id: creds
        if: github.event_name == 'pull_request' && inputs.preview-base-host != ''
        env:
          SALT: ${{ secrets.preview-secret-salt }}
          ENVIRONMENT: "${{ steps.meta.outputs.slug }}-pr-${{ github.event.number }}"
          PR_NUMBER: ${{ github.event.number }}
        run: |
          set -euo pipefail
          if [ -z "${SALT:-}" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "no salt supplied; the environment will be open and this will say so"
            exit 0
          fi
          PASSWORD=$(printf '%s|%s|%s|%s' "$SALT" "$ENVIRONMENT" "$PR_NUMBER" "basic-auth" \
            | sha256sum | cut -c1-20)
          echo "enabled=true" >> "$GITHUB_OUTPUT"
          echo "username=preview" >> "$GITHUB_OUTPUT"
          # Masked so it cannot appear in a log line, then written where only
          # the pull request comment step reads it.
          echo "::add-mask::$PASSWORD"
          echo "password=$PASSWORD" >> "$GITHUB_OUTPUT"

      - name: Wait for the environment to answer
        id: health
        if: github.event_name == 'pull_request' && inputs.preview-base-host != ''
        env:
          URL: "${{ inputs.scheme }}://${{ steps.meta.outputs.slug }}-pr-${{ github.event.number }}.${{ inputs.preview-base-host }}"
          AUTH_ON: ${{ steps.creds.outputs.enabled }}
          PREVIEW_USER: ${{ steps.creds.outputs.username }}
          PREVIEW_PASSWORD: ${{ steps.creds.outputs.password }}
          # The baseline the wait is measured from, and it is not the same
          # question for the two cases.
          #
          # Opening a pull request: from created_at. Not from when this job
          # started — the difference is the build, and the build is part of what
          # a reviewer waits through, so measuring from job start would flatter
          # the platform by excluding its largest component.
          #
          # Pushing to one that already exists: from the commit. Using created_at
          # here measures the age of the pull request rather than the speed of
          # the platform, and grows without bound — the first real samples
          # recorded 1138s and 1567s for redeployments that took about a minute,
          # because the pull request had been open for twenty.
          OPENED_AT: ${{ github.event.pull_request.created_at }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          IS_FIRST: ${{ github.event.action == 'opened' }}
        run: |
          set -uo pipefail
          echo "url=$URL" >> "$GITHUB_OUTPUT"

          CURL_AUTH=()
          if [ "$AUTH_ON" = "true" ]; then
            CURL_AUTH=(--user "${PREVIEW_USER}:${PREVIEW_PASSWORD}")
          fi

          if [ "$IS_FIRST" = "true" ]; then
            baseline_at="$OPENED_AT"
          else
            # Committer date of the commit under review. The closest thing to
            # "when did somebody push this" that is exact rather than inferred —
            # updated_at also moves on comments and reviews, which would make a
            # redeployment look faster for having been discussed first.
            baseline_at=$(git log -1 --format=%cI "$HEAD_SHA" 2>/dev/null || echo '')
          fi
          baseline_epoch=$(date -u -d "$baseline_at" +%s 2>/dev/null || echo 0)

          deadline=$(( SECONDS + ${{ inputs.health-timeout-seconds }} ))
          while [ $SECONDS -lt $deadline ]; do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 "${CURL_AUTH[@]}" "$URL" || true)
            if [ "$code" = "200" ]; then
              echo "ready=true" >> "$GITHUB_OUTPUT"
              # The SLI: pull request opened -> URL serving. Recorded even on a
              # push to an existing pull request, where it measures a
              # redeployment rather than a first provision; slo-report.rb
              # separates the two.
              if [ "$baseline_epoch" -gt 0 ]; then
                echo "provisioning_seconds=$(( $(date -u +%s) - baseline_epoch ))" >> "$GITHUB_OUTPUT"
              fi
              echo "answered 200 after ${SECONDS}s of waiting"
              exit 0
            fi
            sleep 10
          done

          # Not a build failure: the image is published and correct, and ArgoCD
          # may still be converging. The comment says so rather than lying.
          echo "ready=false" >> "$GITHUB_OUTPUT"
          echo "no 200 within ${{ inputs.health-timeout-seconds }}s (last: ${code:-none})"

      # Runs the repository's own tests against the environment that is
      # actually serving, not against a copy of it on a runner.
      #
      # This is what turns the preview into a gate. Without it a reviewer is
      # told "here is a link" and has to work out for themselves whether
      # anything is broken; with it, the pull request carries a check that
      # either passed against a real deployment or did not.
      - name: Run the preview smoke tests against the live environment
        if: >-
          github.event_name == 'pull_request' &&
          inputs.preview-base-host != '' &&
          inputs.preview-test != '' &&
          steps.health.outputs.ready == 'true'
        working-directory: ${{ inputs.preview-test-directory }}
        env:
          PREVIEW_URL: ${{ steps.health.outputs.url }}
          PREVIEW_USER: ${{ steps.creds.outputs.username }}
          PREVIEW_PASSWORD: ${{ steps.creds.outputs.password }}
        run: ${{ inputs.preview-test }}

      # A Deployment, so the environment appears in the pull request's own
      # timeline and in the repository's Environments tab — with a native
      # "View deployment" button and a history of what was deployed when.
      # A comment is a message; this is the thing GitHub already models.
      #
      # transient_environment marks it as disposable, so GitHub retires the
      # entry itself once the environment is gone.
      - name: Record a deployment
        if: github.event_name == 'pull_request' && inputs.preview-base-host != ''
        continue-on-error: true
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          URL: ${{ steps.health.outputs.url }}
          READY: ${{ steps.health.outputs.ready }}
          ENVIRONMENT: "${{ steps.meta.outputs.slug }}-pr-${{ github.event.number }}"
        with:
          script: |
            const { owner, repo } = context.repo;
            const ref = context.payload.pull_request.head.sha;

            const deployment = await github.rest.repos.createDeployment({
              owner, repo, ref,
              environment: process.env.ENVIRONMENT,
              transient_environment: true,
              auto_merge: false,
              // The checks that matter already ran; requiring them here would
              // deadlock against the job creating the deployment.
              required_contexts: [],
              description: 'Preview environment',
            });

            if (!deployment.data.id) {
              core.info('deployment not created: ' + JSON.stringify(deployment.data));
              return;
            }

            await github.rest.repos.createDeploymentStatus({
              owner, repo,
              deployment_id: deployment.data.id,
              state: process.env.READY === 'true' ? 'success' : 'in_progress',
              environment_url: process.env.URL,
              log_url: `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`,
              description: process.env.READY === 'true'
                ? 'Environment is serving'
                : 'Image published; ArgoCD is still converging',
            });

      # Tells the reviewer where to look. Edits one pinned comment rather than
      # adding another per push, so a long-lived pull request stays readable.
      - name: Post the preview URL on the pull request
        if: github.event_name == 'pull_request' && inputs.preview-base-host != ''
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          PREVIEW_URL: ${{ steps.health.outputs.url }}
          READY: ${{ steps.health.outputs.ready }}
          IMAGE: "${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}"
          AUTH_ON: ${{ steps.creds.outputs.enabled }}
          PREVIEW_USER: ${{ steps.creds.outputs.username }}
          PREVIEW_PASSWORD: ${{ steps.creds.outputs.password }}
          PROVISIONING_SECONDS: ${{ steps.health.outputs.provisioning_seconds }}
        with:
          script: |
            const marker = '<!-- preview-environment -->';
            const ready = process.env.READY === 'true';
            const authOn = process.env.AUTH_ON === 'true';
            const seconds = Number(process.env.PROVISIONING_SECONDS);

            // Say which of the two it is. A link that has been checked and a
            // link that has not are different things, and a reviewer clicking
            // a dead one learns to distrust all of them.
            const lines = [
              marker,
              '### Preview environment',
              '',
              ready
                ? `${process.env.PREVIEW_URL} — responding`
                : `${process.env.PREVIEW_URL} — not answering yet`,
              '',
              ready
                ? 'Checked before posting: it returned 200.'
                : 'The image is published and ArgoCD is still converging. Give it a minute; if it stays down, the environment could not start.',
            ];

            // The password is delivered here on purpose. Whoever can read this
            // pull request can open the environment, and whoever cannot, cannot
            // — so GitHub's existing permissions answer the access question and
            // the platform stores no user list of its own.
            if (authOn) {
              lines.push(
                '',
                '<details><summary>Credentials</summary>',
                '',
                '```',
                `user:     ${process.env.PREVIEW_USER}`,
                `password: ${process.env.PREVIEW_PASSWORD}`,
                '```',
                '',
                'Environments are private and marked `noindex`, so this link is not',
                'reachable by anyone who cannot see this pull request, and not',
                'indexable by search engines.',
                '</details>',
              );
            } else {
              lines.push(
                '',
                '> This environment is **open to anyone with the link** — the cluster has',
                '> no secret salt configured, so no password could be derived.',
              );
            }

            lines.push(
              '',
              'Image `' + process.env.IMAGE + '`',
            );

            if (Number.isFinite(seconds) && seconds > 0) {
              lines.push(`Ready ${seconds}s after this pull request was opened.`);
            }

            lines.push(
              '',
              'Removed automatically when this pull request closes.',
            );

            // The API wants a string. Handing it the array was a real failure
            // here — "HttpError: Invalid request", after a successful build and
            // a passing smoke test, with nothing in the message to say which
            // field was wrong.
            const body = lines.join('\n');

            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number, per_page: 100,
            });
            const existing = comments.find((c) => c.body.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
