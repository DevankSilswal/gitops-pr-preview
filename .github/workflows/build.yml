name: build

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]

env:
  REGISTRY: ghcr.io

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # On pull_request GitHub checks out a synthetic merge commit whose SHA
          # nothing else knows about. ArgoCD deploys the PR *head*, so build and
          # test that same commit or the image tag will never be found.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
        working-directory: app
      - run: npm test
        working-directory: app

  # The chart and the Terraform are as much of the product as the application
  # is. Without this, a chart that fails to render would still publish an image
  # and only break once ArgoCD tried to sync it.
  manifests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: azure/setup-helm@v4

      - name: Lint the chart in both TLS modes
        run: |
          helm lint charts/preview-app --set ingress.host=pr-1.127-0-0-1.nip.io
          helm lint charts/preview-app \
            --set ingress.host=pr-1.127-0-0-1.nip.io \
            --set ingress.tls.enabled=true

      - name: Render the chart the way ArgoCD will
        run: |
          helm template preview-pr-1 charts/preview-app \
            --namespace pr-1 \
            --set environment=pr-1 \
            --set prNumber=1 \
            --set namespace.create=true \
            --set ingress.host=pr-1.127-0-0-1.nip.io > /tmp/rendered.yaml
          test -s /tmp/rendered.yaml

      - name: Fail if the chart forgets the pull request identity
        run: |
          grep -q 'name: PR_NUMBER' /tmp/rendered.yaml
          grep -q 'value: "pr-1"' /tmp/rendered.yaml
          grep -q 'host: "pr-1.127-0-0-1.nip.io"' /tmp/rendered.yaml
          # A namespace ArgoCD does not own cannot be pruned, which leaks one
          # namespace per pull request.
          grep -q 'kind: Namespace' /tmp/rendered.yaml

      - uses: hashicorp/setup-terraform@v3
      - name: Validate the Terraform
        run: terraform init -backend=false -input=false && terraform validate
        working-directory: infra

  build:
    # A failing test or an unrenderable chart must never produce an environment.
    needs: [test, manifests]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Compute image tag and build metadata
        id: meta
        run: |
          # Container registries reject uppercase in image names, and GitHub
          # usernames are frequently mixed case. Actions has no lower() so it
          # has to be done in the shell.
          OWNER_LC=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "image=${REGISTRY}/${OWNER_LC}/preview-app" >> "$GITHUB_OUTPUT"

          SHA="${{ github.event.pull_request.head.sha || github.sha }}"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            # The ApplicationSet rebuilds this exact string from {{number}} and
            # {{head_sha}}. Full SHAs on both sides means no truncation mismatch.
            echo "tag=pr-${{ github.event.number }}-${SHA}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=main-${SHA}" >> "$GITHUB_OUTPUT"
          fi
          echo "sha=${SHA}" >> "$GITHUB_OUTPUT"
          echo "built_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      # The cluster runs on Oracle's free Ampere A1 nodes, which are arm64.
      # An amd64-only image would CrashLoopBackOff there.
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: app
          platforms: linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}
          build-args: |
            GIT_SHA=${{ steps.meta.outputs.sha }}
            BUILT_AT=${{ steps.meta.outputs.built_at }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        run: |
          echo "Image: \`${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}\`" >> "$GITHUB_STEP_SUMMARY"

      # Tell the reviewer where to look. Edits one pinned comment rather than
      # adding a new one per push, so a long-lived PR stays readable.
      - name: Post the preview URL on the pull request
        if: github.event_name == 'pull_request' && vars.PREVIEW_BASE_HOST != ''
        uses: actions/github-script@v7
        env:
          PREVIEW_URL: "http://pr-${{ github.event.number }}.${{ vars.PREVIEW_BASE_HOST }}"
          IMAGE: "${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}"
        with:
          script: |
            const marker = '<!-- preview-environment -->';
            const body = [
              marker,
              `### Preview environment`,
              '',
              `${process.env.PREVIEW_URL}`,
              '',
              `Image \`${process.env.IMAGE}\``,
              '',
              'ArgoCD syncs within about a minute of this build finishing. The',
              'environment is removed automatically when this pull request closes.',
            ].join('\n');

            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number, per_page: 100,
            });
            const existing = comments.find((c) => c.body.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
