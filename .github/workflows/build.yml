name: build

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]
    paths-ignore:
      # The promote job at the end of this workflow commits this file. Without
      # the exclusion that commit would trigger another build, which would
      # commit again, forever.
      - charts/preview-app/values-production.yaml

env:
  REGISTRY: ghcr.io

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # On pull_request GitHub checks out a synthetic merge commit whose SHA
          # nothing else knows about. ArgoCD deploys the PR *head*, so build and
          # test that same commit or the image tag will never be found.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
        working-directory: app
      - run: npm test
        working-directory: app

  # The chart and the Terraform are as much of the product as the application
  # is. Without this, a chart that fails to render would still publish an image
  # and only break once ArgoCD tried to sync it.
  manifests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4

      - name: Lint the chart in both TLS modes
        run: |
          helm lint charts/preview-app --set ingress.host=pr-1.127-0-0-1.nip.io
          helm lint charts/preview-app \
            --set ingress.host=pr-1.127-0-0-1.nip.io \
            --set ingress.tls.enabled=true

      - name: Render the chart the way ArgoCD will
        run: |
          helm template preview-pr-1 charts/preview-app \
            --namespace pr-1 \
            --set environment=pr-1 \
            --set prNumber=1 \
            --set namespace.create=true \
            --set ingress.host=pr-1.127-0-0-1.nip.io > /tmp/rendered.yaml
          test -s /tmp/rendered.yaml

      - name: Fail if the chart forgets the pull request identity
        run: |
          grep -q 'name: PR_NUMBER' /tmp/rendered.yaml
          grep -q 'value: "pr-1"' /tmp/rendered.yaml
          grep -q 'host: "pr-1.127-0-0-1.nip.io"' /tmp/rendered.yaml
          # A namespace ArgoCD does not own cannot be pruned, which leaks one
          # namespace per pull request.
          grep -q 'kind: Namespace' /tmp/rendered.yaml

      # The JavaScript inside github-script steps is a YAML string, so nothing
      # else checks it; a syntax error would surface minutes into a live run.
      - name: Syntax-check the scripts embedded in workflows
        run: ./scripts/check-workflow-scripts.sh

      - name: Install promtool
        run: |
          set -euo pipefail
          VER=3.13.2
          curl -sSfL "https://github.com/prometheus/prometheus/releases/download/v$VER/prometheus-$VER.linux-amd64.tar.gz" \
            | tar -xz --strip-components=1 -C /usr/local/bin "prometheus-$VER.linux-amd64/promtool"

      # An alert that parses but never fires is worse than no alert, because
      # everyone assumes something is watching.
      - name: Unit-test the alert rules
        run: ./scripts/check-alerts.sh

      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
      - name: Validate the Terraform for every supported cloud
        run: |
          for dir in infra/*/; do
            echo "== $dir"
            terraform -chdir="$dir" init -backend=false -input=false >/dev/null
            terraform -chdir="$dir" validate
          done

  build:
    # A failing test or an unrenderable chart must never produce an environment.
    needs: [test, manifests]
    # A fork's token cannot write packages, so the push would fail after
    # several minutes of building for two architectures. Skipping is honest:
    # the tests above still run and still gate the pull request, and
    # preview-lifecycle.yml explains on the pull request why no environment
    # appeared.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    outputs:
      # Consumed by promote, which writes it into the production values file,
      # and by e2e, which deploys exactly this artefact to a real cluster.
      tag: ${{ steps.meta.outputs.tag }}
      image: ${{ steps.meta.outputs.image }}
    permissions:
      contents: read
      packages: write
      pull-requests: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Compute image tag and build metadata
        id: meta
        run: |
          # Container registries reject uppercase in image names, and GitHub
          # usernames are frequently mixed case. Actions has no lower() so it
          # has to be done in the shell.
          OWNER_LC=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "image=${REGISTRY}/${OWNER_LC}/preview-app" >> "$GITHUB_OUTPUT"

          SHA="${{ github.event.pull_request.head.sha || github.sha }}"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            # The ApplicationSet rebuilds this exact string from {{number}} and
            # {{head_sha}}. Full SHAs on both sides means no truncation mismatch.
            echo "tag=pr-${{ github.event.number }}-${SHA}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=main-${SHA}" >> "$GITHUB_OUTPUT"
          fi
          echo "sha=${SHA}" >> "$GITHUB_OUTPUT"
          echo "built_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      # Built for both architectures because the target is not fixed: Azure's
      # B-series VMs are amd64, Oracle's free Ampere nodes are arm64, and local
      # development happens on Apple Silicon. A single-architecture image ties
      # the platform to one host and fails as an ImagePullBackOff on the other,
      # which is a confusing way to learn about it.
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: app
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}
          build-args: |
            GIT_SHA=${{ steps.meta.outputs.sha }}
            BUILT_AT=${{ steps.meta.outputs.built_at }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Scanning after the push rather than before is deliberate: the artefact
      # that gets scanned is then byte-for-byte the one a preview environment
      # will run, not a separately built copy of it.
      - name: Scan the published image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          format: table

      - name: Summary
        run: |
          echo "Image: \`${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}\`" >> "$GITHUB_STEP_SUMMARY"

      # Tell the reviewer where to look. Edits one pinned comment rather than
      # adding a new one per push, so a long-lived PR stays readable.
      - name: Post the preview URL on the pull request
        if: github.event_name == 'pull_request' && vars.PREVIEW_BASE_HOST != ''
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          # https by default because the platform enables TLS by default and
          # ingress-nginx answers plain http with a 308. Set PREVIEW_SCHEME to
          # http for a cluster running without certificates.
          PREVIEW_URL: "${{ vars.PREVIEW_SCHEME || 'https' }}://pr-${{ github.event.number }}.${{ vars.PREVIEW_BASE_HOST }}"
          IMAGE: "${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}"
        with:
          script: |
            const marker = '<!-- preview-environment -->';
            const body = [
              marker,
              `### Preview environment`,
              '',
              `${process.env.PREVIEW_URL}`,
              '',
              `Image \`${process.env.IMAGE}\``,
              '',
              'ArgoCD syncs within about a minute of this build finishing. The',
              'environment is removed automatically when this pull request closes.',
            ].join('\n');

            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number, per_page: 100,
            });
            const existing = comments.find((c) => c.body.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }

  # Releasing to production is a commit, not a deploy command. CI writes the
  # tag it just published into the repository; ArgoCD sees the commit and rolls
  # it out. The pipeline therefore never needs cluster credentials, and the
  # history of this file is the deployment log.
  promote:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Record the released image tag
        env:
          TAG: ${{ needs.build.outputs.tag }}
          VALUES: charts/preview-app/values-production.yaml
        run: |
          set -euo pipefail
          test -n "$TAG"

          current=$(grep -E '^  tag: ' "$VALUES" | awk '{print $2}')
          if [ "$current" = "$TAG" ]; then
            echo "production already at $TAG"
            exit 0
          fi

          sed -i "s|^  tag: .*|  tag: ${TAG}|" "$VALUES"
          grep -q "  tag: ${TAG}" "$VALUES"

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$VALUES"
          git commit -m "chore(release): deploy ${TAG} to production"
          git push
          echo "promoted $current -> $TAG" >> "$GITHUB_STEP_SUMMARY"

  # Renders and lints prove the templates are well formed. This proves the
  # things only a cluster can: that probes pass, that ingress routes by Host,
  # that the kubelet honours the security context, and that removing a release
  # removes its workloads. Every one of those has broken here before.
  e2e:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4

      - uses: helm/kind-action@a1b0e391336a6ee6713a0583f8c6240d70863de3 # v1.12.0
        with:
          cluster_name: e2e
          config: scripts/kind-cluster.yaml

      - name: Exercise a preview environment end to end
        run: ./scripts/e2e-test.sh "${{ needs.build.outputs.image }}" "${{ needs.build.outputs.tag }}"

      - name: Show what the cluster was doing if it failed
        if: failure()
        run: |
          kubectl get pods -A
          kubectl describe pods -n e2e-pr || true
          kubectl logs -n e2e-pr -l app.kubernetes.io/name=preview-app --tail=50 || true
