name: build

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]
    paths-ignore:
      # The promote job at the end of this workflow commits this file. Without
      # the exclusion that commit would trigger another build, which would
      # commit again, forever.
      - charts/preview-app/values-production.yaml

# One build per pull request. Five pushes used to mean five builds racing each
# other for the same tag, and the one that finished last won regardless of
# which commit it came from.
concurrency:
  group: build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # On pull_request GitHub checks out a synthetic merge commit whose SHA
          # nothing else knows about. ArgoCD deploys the PR *head*, so build and
          # test that same commit or the image tag will never be found.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
        working-directory: app
      - run: npm test
        working-directory: app

  # The chart and the Terraform are as much of the product as the application
  # is. Without this, a chart that fails to render would still publish an image
  # and only break once ArgoCD tried to sync it.
  manifests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1

      - name: Lint the chart in both TLS modes
        run: |
          helm lint charts/preview-app --set ingress.host=pr-1.127-0-0-1.nip.io
          helm lint charts/preview-app \
            --set ingress.host=pr-1.127-0-0-1.nip.io \
            --set ingress.tls.enabled=true

      - name: Render the chart the way ArgoCD will
        run: |
          helm template preview-arcade-1 charts/preview-app \
            --namespace arcade-pr-1 \
            --set environment=arcade-pr-1 \
            --set prNumber=1 \
            --set namespace.create=true \
            --set ingress.host=arcade-pr-1.127-0-0-1.nip.io > /tmp/rendered.yaml
          test -s /tmp/rendered.yaml

      # A chart that only works for this application is not a platform. Render
      # it the way a differently-shaped adopter would arrive.
      - name: Render the chart for an application with another shape
        run: |
          helm template preview-other-7 charts/preview-app \
            --namespace other-pr-7 \
            --set service.targetPort=8080 \
            --set healthPath=/healthz \
            --set ingress.host=other-pr-7.127-0-0-1.nip.io > /tmp/other.yaml
          grep -q 'containerPort: 8080' /tmp/other.yaml
          grep -q 'path: /healthz' /tmp/other.yaml

      # ArgoCD reads deploy/platform/onboarded/ directly, so a malformed file
      # would reach the cluster and show up as an environment that never
      # appears. Onboarding is a pull request; this is what reviews it.
      - name: Validate the onboarded repositories
        run: |
          for m in deploy/argocd/*.yaml; do
            PREVIEW_BASE_HOST=example.nip.io TLS_ENABLED=false TLS_ISSUER=selfsigned \
              ./scripts/render-argocd.rb "$m" > /dev/null
          done

      - name: Fail if the chart forgets the pull request identity
        run: |
          grep -q 'name: PR_NUMBER' /tmp/rendered.yaml
          grep -q 'value: "arcade-pr-1"' /tmp/rendered.yaml
          grep -q 'host: "arcade-pr-1.127-0-0-1.nip.io"' /tmp/rendered.yaml
          # A namespace ArgoCD does not own cannot be pruned, which leaks one
          # namespace per pull request.
          grep -q 'kind: Namespace' /tmp/rendered.yaml

      # The JavaScript inside github-script steps is a YAML string, so nothing
      # else checks it; a syntax error would surface minutes into a live run.
      - name: Syntax-check the scripts embedded in workflows
        run: ./scripts/check-workflow-scripts.sh

      # The slug is derived in Ruby by discovery, which decides the hostname
      # that exists, and in shell by the build workflow, which decides the one
      # the comment advertises. They disagreed once and every link was wrong.
      - name: Check the two slug derivations agree
        run: ./scripts/check-slug-agreement.sh

      - name: Install promtool
        run: |
          set -euo pipefail
          VER=3.13.2
          curl -sSfL "https://github.com/prometheus/prometheus/releases/download/v$VER/prometheus-$VER.linux-amd64.tar.gz" \
            | tar -xz --strip-components=1 -C /usr/local/bin "prometheus-$VER.linux-amd64/promtool"

      # An alert that parses but never fires is worse than no alert, because
      # everyone assumes something is watching.
      - name: Unit-test the alert rules
        run: ./scripts/check-alerts.sh

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
      - name: Validate the Terraform for every supported cloud
        run: |
          for dir in infra/*/; do
            echo "== $dir"
            terraform -chdir="$dir" init -backend=false -input=false >/dev/null
            terraform -chdir="$dir" validate
          done

  # Calls the same reusable workflow adopters call, so the path documented in
  # docs/onboarding.md is the one exercised here on every commit rather than a
  # parallel copy that drifts.
  build:
    needs: [test, manifests]
    uses: ./.github/workflows/preview-build.yml
    permissions:
      contents: read
      packages: write
      pull-requests: write
      # For the Deployment that puts the environment in the pull request's
      # timeline rather than only in a comment.
      deployments: write
    with:
      image-name: preview-app
      context: app
      preview-base-host: ${{ vars.PREVIEW_BASE_HOST }}
      # preview-lifecycle.yml grants the label here, with a cap and a bot
      # check the reusable workflow cannot enforce from inside one repository.
      manage-label: false

  # Releasing to production is a commit, not a deploy command. CI writes the
  # tag it just published into the repository; ArgoCD sees the commit and rolls
  # it out. The pipeline therefore never needs cluster credentials, and the
  # history of this file is the deployment log.
  promote:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Record the released image tag
        env:
          TAG: ${{ needs.build.outputs.tag }}
          VALUES: charts/preview-app/values-production.yaml
        run: |
          set -euo pipefail
          test -n "$TAG"

          current=$(grep -E '^  tag: ' "$VALUES" | awk '{print $2}')
          if [ "$current" = "$TAG" ]; then
            echo "production already at $TAG"
            exit 0
          fi

          sed -i "s|^  tag: .*|  tag: ${TAG}|" "$VALUES"
          grep -q "  tag: ${TAG}" "$VALUES"

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$VALUES"
          git commit -m "chore(release): deploy ${TAG} to production"
          git push
          echo "promoted $current -> $TAG" >> "$GITHUB_STEP_SUMMARY"

  # Renders and lints prove the templates are well formed. This proves the
  # things only a cluster can: that probes pass, that ingress routes by Host,
  # that the kubelet honours the security context, and that removing a release
  # removes its workloads. Every one of those has broken here before.
  e2e:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    needs: build
    runs-on: ubuntu-latest
    # A hung kind cluster otherwise holds a runner for six hours.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1

      - uses: helm/kind-action@a1b0e391336a6ee6713a0583f8c6240d70863de3 # v1.12.0
        with:
          cluster_name: e2e
          config: scripts/kind-cluster.yaml

      - name: Exercise a preview environment end to end
        run: ./scripts/e2e-test.sh "${{ needs.build.outputs.image }}" "${{ needs.build.outputs.tag }}"

      - name: Show what the cluster was doing if it failed
        if: failure()
        run: |
          kubectl get pods -A
          kubectl describe pods -n e2e-pr || true
          kubectl logs -n e2e-pr -l app.kubernetes.io/name=preview-app --tail=50 || true
